<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차곡차곡 — 월간 플래너</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23d32f53'/%3E%3Ctext x='8' y='29' font-size='28' fill='white'%3E✓%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#202120;--muted:#858887;--red:#cf3053;--line:#eceeed;--gray:#d9dddf}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #cc476c;outline-offset:4px}header{max-width:1370px;margin:auto;height:100px;padding:0 48px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.brand .flower{--size:29px;--color:var(--red)}.save{font-size:12px;color:var(--muted)}main{max-width:1370px;padding:26px 48px 50px;margin:auto;display:grid;grid-template-columns:380px minmax(0,1fr);gap:70px}.sidebar{border-right:1px solid var(--line);padding-right:35px}.profile{display:inline-flex;background:#202120;color:white;align-items:center;gap:12px;border-radius:30px;padding:8px 18px 8px 8px;font-size:14px;margin-bottom:30px}.avatar{width:32px;height:32px;border-radius:50%;background:#f1f2f2;display:grid;place-items:center}.avatar .flower{--size:18px;--color:#cccfd1}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px;gap:5px}.monthbar h2{font-size:21px;margin:0;letter-spacing:-.8px}.controls{display:flex;gap:5px;align-items:center}.nav{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;font-size:20px;line-height:1}.todaybtn{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:6px 10px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{text-align:center;font-size:13px;margin-bottom:10px}.sun{color:#f25768}.sat{color:#408cf2}.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;height:77px;padding:4px 0;border-radius:12px}.day:hover{background:#f8f8f8}.day.selected{background:#f5f5f5}.daynum{font-size:14px;min-width:25px;height:25px;display:grid;place-items:center}.day.selected .daynum{background:#202120;color:white;border-radius:50%;font-weight:700}.day.today:not(.selected) .daynum{box-shadow:inset 0 0 0 1px #b5b9b8;border-radius:50%}.flower{--size:34px;--color:var(--gray);width:var(--size);height:var(--size);display:inline-grid;place-items:center;position:relative;flex-shrink:0;color:white;isolation:isolate}.flower:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 29% 29%,var(--color) 0 33%,transparent 35%),radial-gradient(circle at 71% 29%,var(--color) 0 33%,transparent 35%),radial-gradient(circle at 29% 71%,var(--color) 0 33%,transparent 35%),radial-gradient(circle at 71% 71%,var(--color) 0 33%,transparent 35%)}.flower.black{--color:#222323}.flower.red{--color:var(--red)}.flower.mixed:before{background:radial-gradient(circle at 29% 29%,#db4565e8 0 33%,transparent 35%),radial-gradient(circle at 71% 29%,#cc2e51e8 0 33%,transparent 35%),radial-gradient(circle at 29% 71%,#282929 0 33%,transparent 35%),radial-gradient(circle at 71% 71%,#282929 0 33%,transparent 35%)}.flower .check{font-size:23px;line-height:1;font-weight:700}.flower .remaining{font-size:14px}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:25px 0}.legend span{display:flex;gap:5px;align-items:center}.legend i{width:7px;height:7px;border-radius:50%;background:var(--gray)}.legend .pink{background:var(--red)}.legend .dark{background:#222}.monthsummary{border-top:1px solid var(--line);padding-top:23px;margin-top:24px}.summaryline{display:flex;align-items:center;justify-content:space-between;font-size:14px}.summaryline strong{color:var(--red);font-size:20px}.meter{height:4px;background:#f0f1f1;margin:15px 0;border-radius:3px;overflow:hidden}.meter span{display:block;height:100%;background:var(--red);transition:width .2s}.caption{font-size:12px;color:var(--muted);line-height:1.8}.right{padding-top:3px}.datehead{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line);margin-bottom:33px;gap:15px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:9px}h1{font-size:29px;letter-spacing:-1.3px;line-height:1.4;margin:0}.daystat{font-size:13px;color:var(--muted);margin-top:8px}.badge{font-size:13px;background:#f7f7f7;padding:9px 13px;border-radius:30px;white-space:nowrap}.category{margin-bottom:30px}summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px}summary::-webkit-details-marker{display:none}.catpill{display:flex;align-items:center;gap:12px;background:#f3f3f3;border-radius:30px;padding:8px 10px 8px 17px;font-size:17px;font-weight:700}.category.important .catpill{color:var(--red);background:#fcf1f4}.categorycount{font-size:12px;color:#969a98;font-weight:400}.plus{width:29px;height:29px;display:grid;place-items:center;background:#fff;border:1px solid #e6e7e7;border-radius:50%;font-size:23px;font-weight:400;line-height:1}.chevron{margin-left:auto;font-size:19px;color:#969a98}.category:not([open]) .chevron{transform:rotate(-90deg)}.task{display:flex;gap:13px;align-items:center;min-height:61px;border-bottom:1px solid #f2f3f3;padding:10px 0}.toggle{padding:0;display:grid;place-items:center;flex-shrink:0}.toggle .flower{--size:31px}.toggle .check{font-size:21px}.tasktext{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}.task.done .tasktext{color:#8e9390;text-decoration:line-through;text-decoration-color:#c6cbc8}.remove{font-size:19px;color:#a8adaa;width:30px;opacity:0}.task:hover .remove,.remove:focus-visible{opacity:1}.add{display:flex;gap:10px;padding-top:15px;align-items:center}.add input{border:0;border-bottom:1px solid transparent;outline-offset:0;min-width:0;flex:1;padding:9px 0;background:transparent;font-size:14px}.add input::placeholder{color:#a0a5a2}.add input:focus{border-bottom-color:#9c9f9d;outline:none}.add button{font-size:13px;border:1px solid #e7e9e8;padding:6px 12px;border-radius:20px}.add button:hover{background:#f5f5f5}.empty{font-size:14px;color:#a0a5a2;padding:13px 0 5px}.newcat{border:1px dashed #d7dcd9;border-radius:24px;padding:10px 17px;color:#7d847f;font-size:13px}.categoryform{display:flex;gap:8px;margin-top:12px}.categoryform[hidden]{display:none}.categoryform input{border:1px solid #dce0dd;border-radius:8px;padding:9px;min-width:0}.categoryform button{border:1px solid #dce0dd;border-radius:8px;padding:8px 12px;font-size:14px}.foot{margin-top:45px;font-size:12px;color:#a1a5a3}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#252726;color:white;border-radius:12px;font-size:14px;box-shadow:0 5px 25px #0002;z-index:4}.toast[hidden]{display:none}@media(max-width:1100px){main{gap:35px;grid-template-columns:340px minmax(0,1fr);padding:20px 30px}.sidebar{padding-right:24px}header{padding:0 30px}}@media(max-width:760px){header{height:76px;padding:0 22px}.brand{font-size:21px}.save{font-size:11px}main{display:block;padding:12px 22px 35px}.sidebar{border:0;padding:0;max-width:450px;margin:0 auto 35px}.profile{margin-bottom:22px}.day{height:75px}.monthsummary{margin-top:16px}.right{border-top:1px solid var(--line);padding-top:25px}.datehead{margin-bottom:25px}h1{font-size:25px}.remove{opacity:1}.foot{margin-top:30px}.monthbar h2{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><header><div class="brand"><span class="flower" aria-hidden="true"><span class="check">✓</span></span>차곡차곡</div><span class="save" id="save">이 브라우저에 자동 저장</span></header>
<main><aside class="sidebar"><div class="profile"><span class="avatar"><span class="flower" aria-hidden="true"></span></span>나의 플래너</div><div class="monthbar"><h2 id="month"></h2><nav class="controls" aria-label="달력 이동"><button class="todaybtn" id="today">오늘</button><button class="nav" id="prev" aria-label="이전 달">‹</button><button class="nav" id="next" aria-label="다음 달">›</button></nav></div><div class="weekdays" aria-hidden="true"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div><div class="calendar" id="calendar" aria-label="월간 달력"></div><div class="legend"><span><i class="pink"></i>중요 일정</span><span><i class="dark"></i>일반 할 일</span><span><i></i>미완료</span></div><section class="monthsummary"><div class="summaryline"><span>이번 달 완료한 일</span><strong id="monthcount"></strong></div><div class="meter"><span id="meter"></span></div><div class="caption">날짜를 누르면 그날의 할 일이 보여요.<br>모두 완료한 날에는 체크 도장이 찍혀요.</div></section></aside>
<section class="right"><div class="datehead"><div><div class="eyebrow" id="year"></div><h1 id="selectedDate"></h1><div class="daystat" id="daystat"></div></div><span class="badge" id="badge"></span></div><div id="categories"></div><button class="newcat" id="newcat">＋ 카테고리 추가</button><form id="categoryform" class="categoryform" hidden><input id="categoryname" aria-label="새 카테고리 이름" placeholder="카테고리 이름" maxlength="25" required><button type="submit">추가</button><button type="button" id="cancelcat">취소</button></form><div class="foot">기록은 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 기록도 삭제됩니다.</div></section></main><div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='chagog-monthly-v2';const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const now=new Date();let selected=key(now),year=now.getFullYear(),month=now.getMonth(),timer;let state={categories:[{id:'important',name:'중요 일정',color:'red'},{id:'daily',name:'Daily To Do List',color:'black'}],days:{}};let storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed.categories)||!parsed.days)throw Error('invalid');state=parsed}else{const old=JSON.parse(localStorage.getItem('chagog-weekly-v1')||'null');if(old?.weeks){for(const [start,tasks]of Object.entries(old.weeks)){if(!Array.isArray(tasks))continue;for(let day=0;day<7;day++){const date=new Date(start+'T12:00:00');date.setDate(date.getDate()+day);if(isNaN(date))continue;state.days[key(date)]=tasks.map(t=>({id:uid(),name:String(t.name),category:'daily',done:Array.isArray(t.days)&&t.days.includes(day)}))}}}else{state.days[selected]=[{id:uid(),name:'이번 달 중요한 일정 정리하기',category:'important',done:false},{id:uid(),name:'책상 정리하기',category:'daily',done:false},{id:uid(),name:'30분 산책하기',category:'daily',done:false},{id:uid(),name:'오늘 하루 기록하기',category:'daily',done:false}]}}}catch(e){storageOK=false;$('save').textContent='저장된 기록을 읽을 수 없어요'}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(state));$('save').textContent='✓ 저장됨'}catch(e){$('save').textContent='저장 불가 · 현재 창에서만 유지';notify('저장 공간을 사용할 수 없어요.')}}
function notify(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2500)}
const tasksFor=d=>state.days[d]||[];
function flower(color,text,isCheck=false){const el=document.createElement('span');el.className='flower '+color;el.setAttribute('aria-hidden','true');if(text){const label=document.createElement('span');label.className=isCheck?'check':'remaining';label.textContent=text;el.append(label)}return el}
function renderCalendar(){const cal=$('calendar');cal.replaceChildren();$('month').textContent=`${year}년 ${month+1}월`;const first=new Date(year,month,1).getDay(),last=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)cal.append(document.createElement('span'));let total=0,doneTotal=0;for(let day=1;day<=last;day++){const d=new Date(year,month,day),k=key(d),tasks=tasksFor(k),done=tasks.filter(t=>t.done),remaining=tasks.length-done.length;total+=tasks.length;doneTotal+=done.length;const colors=new Set(done.map(t=>state.categories.find(c=>c.id===t.category)?.color||'black'));const color=colors.size>1?'mixed':(colors.values().next().value||'');const complete=tasks.length>0&&remaining===0;const b=document.createElement('button');b.className='day'+(k===selected?' selected':'')+(k===key(now)?' today':'')+(d.getDay()===0?' sun':d.getDay()===6?' sat':'');b.setAttribute('aria-label',`${month+1}월 ${day}일, ${tasks.length}개 중 ${done.length}개 완료`);b.setAttribute('aria-pressed',String(k===selected));b.append(flower(color,complete?'✓':tasks.length?String(remaining):'',complete));const n=document.createElement('span');n.className='daynum';n.textContent=day;b.append(n);b.onclick=()=>{selected=k;render();$('calendar').querySelector('[aria-pressed="true"]').focus({preventScroll:true})};cal.append(b)}$('monthcount').textContent=`${doneTotal} / ${total}`;$('meter').style.width=(total?doneTotal/total*100:0)+'%'}
function renderCategories(){const host=$('categories'),opened=new Map(Array.from(host.children).map(el=>[el.dataset.id,el.open]));host.replaceChildren();const tasks=tasksFor(selected);for(const cat of state.categories){const group=tasks.filter(t=>t.category===cat.id),details=document.createElement('details');details.className='category'+(cat.color==='red'?' important':'');details.dataset.id=cat.id;details.open=opened.get(cat.id)??true;const summary=document.createElement('summary'),pill=document.createElement('span');pill.className='catpill';const title=document.createElement('span');title.textContent=cat.name;const plus=document.createElement('button');plus.type='button';plus.className='plus';plus.textContent='+';plus.setAttribute('aria-label',cat.name+'에 할 일 추가');pill.append(title,plus);const count=document.createElement('span');count.className='categorycount';count.textContent=`${group.filter(t=>t.done).length}/${group.length}`;const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='⌄';summary.append(pill,count,arrow);details.append(summary);if(!group.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='아직 등록한 할 일이 없어요.';details.append(empty)}for(const task of group){const row=document.createElement('div');row.className='task'+(task.done?' done':'');const toggle=document.createElement('button');toggle.className='toggle';toggle.dataset.task=task.id;toggle.setAttribute('aria-label',task.name+(task.done?' 완료 취소':' 완료하기'));toggle.setAttribute('aria-pressed',String(task.done));toggle.append(flower(task.done?cat.color:'',task.done?'✓':'',task.done));toggle.onclick=()=>{task.done=!task.done;save();render();Array.from(document.querySelectorAll('[data-task]')).find(b=>b.dataset.task===task.id)?.focus({preventScroll:true})};const text=document.createElement('span');text.className='tasktext';text.textContent=task.name;const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',task.name+' 삭제');remove.onclick=()=>{if(confirm('“'+task.name+'” 항목을 삭제할까요?')){state.days[selected]=tasksFor(selected).filter(t=>t.id!==task.id);save();render()}};row.append(toggle,text,remove);details.append(row)}const form=document.createElement('form');form.className='add';const input=document.createElement('input');input.placeholder='＋ 할 일 추가';input.maxLength=100;input.required=true;input.setAttribute('aria-label',cat.name+' 새 할 일');const submit=document.createElement('button');submit.type='submit';submit.textContent='추가';form.append(input,submit);form.onsubmit=e=>{e.preventDefault();const name=input.value.trim();if(!name)return;(state.days[selected]??=[]).push({id:uid(),name,category:cat.id,done:false});save();render();Array.from(document.querySelectorAll('details')).find(el=>el.dataset.id===cat.id)?.querySelector('input').focus();notify('할 일을 추가했어요.')};plus.onclick=e=>{e.preventDefault();details.open=true;input.focus()};details.append(form);host.append(details)}}
function render(){renderCalendar();const d=new Date(selected+'T12:00:00'),tasks=tasksFor(selected),done=tasks.filter(t=>t.done).length;$('year').textContent=`${d.getFullYear()} · MY DAILY PLAN`;$('selectedDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${['일','월','화','수','목','금','토'][d.getDay()]}요일`;$('daystat').textContent=tasks.length?`${tasks.length}개의 할 일 중 ${done}개 완료`:'오늘의 할 일을 하나씩 적어보세요.';$('badge').textContent=selected===key(now)?'오늘':`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;renderCategories()}
function move(delta){const d=new Date(year,month+delta,1);year=d.getFullYear();month=d.getMonth();selected=key(d);render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{year=now.getFullYear();month=now.getMonth();selected=key(now);render()};$('newcat').onclick=()=>{$('categoryform').hidden=false;$('categoryname').focus()};$('cancelcat').onclick=()=>{$('categoryform').hidden=true};$('categoryform').onsubmit=e=>{e.preventDefault();const name=$('categoryname').value.trim();if(!name)return;if(state.categories.some(c=>c.name===name)){notify('같은 이름의 카테고리가 있어요.');return}state.categories.push({id:uid(),name,color:'black'});$('categoryname').value='';$('categoryform').hidden=true;save();render()};render();save();
})();
</script></body></html>
