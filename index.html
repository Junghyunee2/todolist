<style>

tehead{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line);margin-bottom:33px;gap:15px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:9px}h1{font-size:29px;letter-spacing:-1.3px;line-height:1.4;margin:0}.daystat{font-size:13px;color:var(--muted);margin-top:8px}.badge{font-size:13px;background:#f7f7f7;padding:9px 13px;border-radius:30px;white-space:nowrap}.category{margin-bottom:30px}summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px}summary::-webkit-details-marker{display:none}.catpill{display:flex;align-items:center;gap:12px;background:#f3f3f3;border-radius:30px;padding:8px 10px 8px 17px;font-size:17px;font-weight:700}.category.important .catpill{color:var(--red);background:#fcf1f4}.categorycount{font-size:12px;color:#969a98;font-weight:400}.plus{width:29px;height:29px;display:grid;place-items:center;background:#fff;border:1px solid #e6e7e7;border-radius:50%;font-size:23px;font-weight:400;line-height:1}.chevron{margin-left:auto;font-size:19px;color:#969a98}.category:not([open]) .chevron{transform:rotate(-90deg)}.task{display:flex;gap:13px;align-items:center;min-height:61px;border-bottom:1px solid #f2f3f3;padding:10px 0}.toggle{padding:0;display:grid;place-items:center;flex-shrink:0}.toggle .flower{--size:31px}.toggle .check{font-size:21px}.tasktext{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}.task.done .tasktext{color:#8e9390;text-decoration:line-through;text-decoration-color:#c6cbc8}.remove{font-size:19px;color:#a8adaa;width:30px;opacity:0}.task:hover .remove,.remove:focus-visible{opacity:1}.add{display:flex;gap:10px;padding-top:15px;align-items:center}.add input{border:0;border-bottom:1px solid transparent;outline-offset:0;min-width:0;flex:1;padding:9px 0;background:transparent;font-size:14px}.add input::placeholder{color:#a0a5a2}.add input:focus{border-bottom-color:#9c9f9d;outline:none}.add button{font-size:13px;border:1px solid #e7e9e8;padding:6px 12px;border-radius:20px}.add button:hover{background:#f5f5f5}.empty{font-size:14px;color:#a0a5a2;padding:13px 0 5px}.newcat{border:1px dashed #d7dcd9;border-radius:24px;padding:10px 17px;color:#7d847f;font-size:13px}.categoryform{display:flex;gap:8px;margin-top:12px}.categoryform[hidden]{display:none}.categoryform input{border:1px solid #dce0dd;border-radius:8px;padding:9px;min-width:0}.categoryform button{border:1px solid #dce0dd;border-radius:8px;padding:8px 12px;font-size:14px}.foot{margin-top:45px;font-size:12px;color:#a1a5a3}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#252726;color:white;border-radius:12px;font-size:14px;box-shadow:0 5px 25px #0002;z-index:4}.toast[hidden]{display:none}@media(max-width:1100px){main{gap:35px;grid-template-columns:340px minmax(0,1fr);padding:20px 30px}.sidebar{padding-right:24px}header{padding:0 30px}}@media(max-width:760px){header{height:76px;padding:0 22px}.brand{font-size:21px}.save{font-size:11px}main{display:block;padding:12px 22px 35px}.sidebar{border:0;padding:0;max-width:450px;margin:0 auto 35px}.profile{margin-bottom:22px}.day{height:75px}.monthsummary{margin-top:16px}.right{border-top:1px solid var(--line);padding-top:25px}.datehead{margin-bottom:25px}h1{font-size:25px}.remove{opacity:1}.foot{margin-top:30px}.monthbar h2{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><header><div class="authbar"><span class="save" id="save" role="status">연결 준비 중</span><button id="authBtn" disabled>관리자 로그인</button></div></header>
<div class="cloudpanel"><p id="cloudMessage" role="status">Firebase 연결 준비 중입니다.</p><div id="gate">기록은 로그인한 관리자만 확인할 수 있습니다. <button id="openLogin" disabled>로그인</button></div><div id="importBox" hidden>이 브라우저에 이전 기록이 있습니다. 새 기록을 작성하기 전에 가져오세요. <button id="importBtn" disabled>기존 기록 가져오기</button></div></div><main><aside class="sidebar"><div class="monthbar"><h2 id="month"></h2><nav class="controls" aria-label="달력 이동"><button class="todaybtn" id="today">오늘</button><button class="nav" id="prev" aria-label="이전 달">‹</button><button class="nav" id="next" aria-label="다음 달">›</button></nav></div><div class="weekdays" aria-hidden="true"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div><div class="calendar" id="calendar" aria-label="월간 달력"></div></aside>
<section class="right"><div class="datehead"><div><div class="eyebrow" id="year"></div><h1 id="selectedDate"></h1><div class="daystat" id="daystat"></div></div><span class="badge" id="badge"></span></div><div id="categories"></div><button class="newcat" id="newcat">＋ 카테고리 추가</button><form id="categoryform" class="categoryform" hidden><input id="categoryname" aria-label="새 카테고리 이름" placeholder="카테고리 이름" maxlength="25" required><button type="submit">추가</button><button type="button" id="cancelcat">취소</button></form><div class="foot">서버 저장이 완료된 기록은 브라우저 데이터를 삭제해도 유지됩니다. 다른 기기에서도 같은 관리자 계정으로 로그인하세요.</div></section></main><div class="toast" id="toast" role="status" hidden></div>
<dialog id="loginDialog"><form id="loginForm"><h2>관리자 로그인</h2><p>일정표·쿠폰북에서 사용하는 계정으로 로그인하세요.</p><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" role="alert"></p><div class="dialogActions"><button id="closeLogin" type="button">취소</button><button id="loginSubmit" type="submit">로그인</button></div></form></dialog><script type="module">
const $=id=>document.getElementById(id);
const ADMIN_UID='olEnOZ3AWkWnhwDC2z7rizPupWv1';
const defaultState=()=>({categories:[{id:'important',name:'중요 일정',color:'red'},{id:'daily',name:'Daily To Do List',color:'black'}],days:{}});
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid=()=>crypto.randomUUID();
const now=new Date();let selected=key(now),year=now.getFullYear(),month=now.getMonth(),timer;
let state=defaultState(),auth,db,sdk,user=null,ready=false,busy=false,stop=null,epoch=0,cloudExists=false;
const clone=value=>JSON.parse(JSON.stringify(value));
function validate(value){
 if(!value||!Array.isArray(value.categories)||!value.days||typeof value.days!=='object'||Array.isArray(value.days))throw Error('기록 형식이 올바르지 않습니다.');
 const ids=new Set();for(const c of value.categories){if(!c||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.name!=='string'||!c.name.trim()||c.name.length>25||!['red','black'].includes(c.color))throw Error('카테고리 형식을 확인해주세요.');ids.add(c.id)}
 for(const [date,tasks]of Object.entries(value.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Array.isArray(tasks))throw Error('일정 형식을 확인해주세요.');const taskIds=new Set();for(const t of tasks){if(!t||typeof t.id!=='string'||taskIds.has(t.id)||typeof t.name!=='string'||!t.name.trim()||t.name.length>100||!ids.has(t.category)||typeof t.done!=='boolean')throw Error('할 일 형식을 확인해주세요.');taskIds.add(t.id)}}
 if(new TextEncoder().encode(JSON.stringify(value)).length>850000)throw Error('저장 가능한 기록 용량을 초과했습니다.');return value;
}
function message(error){if(error?.code==='permission-denied')return 'Firebase 저장 권한이 없습니다. 차곡차곡 규칙 설정을 확인해주세요.';if(error?.code==='unavailable')return '서버에 연결할 수 없습니다. 인터넷 연결을 확인해주세요.';return error?.message||'저장하지 못했습니다. 다시 시도해주세요.'}
function notify(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,5000)}
function syncControls(){document.querySelectorAll('.right input,.right button').forEach(el=>el.disabled=!ready||busy);$('authBtn').disabled=!auth||busy;$('importBtn').disabled=!ready||busy||cloudExists;$('importBox').hidden=!user||!localRecord||cloudExists;$('gate').hidden=!!user;$('save').textContent=busy?'서버에 저장 중…':ready?'✓ Firebase 연결됨':user?'서버 연결 확인 필요':'로그인 후 서버 저장';}
async function commit(change){
 if(!ready||busy||!user){notify('로그인과 서버 연결을 먼저 확인해주세요.');return false}
 const token=epoch,owner=user.uid;busy=true;syncControls();$('cloudMessage').textContent='서버에 저장 중입니다.';
 try{const result=await sdk.runTransaction(db,async tx=>{const ref=sdk.doc(db,'chagog_users',owner),snapshot=await tx.get(ref);const latest=snapshot.exists()?validate(snapshot.data().planner):defaultState();change(latest,snapshot.exists());validate(latest);tx.set(ref,{schemaVersion:1,planner:latest,updatedAt:sdk.serverTimestamp()});return latest;});if(token!==epoch)return false;state=result;cloudExists=true;$('cloudMessage').textContent='서버 저장 완료 · 다른 기기에서도 같은 계정으로 로그인하세요.';render();return true}
 catch(error){if(token===epoch){$('cloudMessage').textContent=message(error)+' 변경 내용은 서버에 저장되지 않았습니다.';notify(message(error))}return false}
 finally{if(token===epoch){busy=false;syncControls()}}
}
function readLocal(){try{const raw=localStorage.getItem('chagog-monthly-v2');if(raw)return validate(JSON.parse(raw));const old=JSON.parse(localStorage.getItem('chagog-weekly-v1')||'null');if(!old?.weeks)return null;const converted=defaultState();for(const [start,tasks]of Object.entries(old.weeks)){if(!Array.isArray(tasks))continue;for(let i=0;i<7;i++){const date=new Date(start+'T12:00:00');date.setDate(date.getDate()+i);if(isNaN(date))continue;converted.days[key(date)]=tasks.map(t=>({id:uid(),name:String(t.name),category:'daily',done:Array.isArray(t.days)&&t.days.includes(i)}))}}return validate(converted)}catch{return null}}
const localRecord=readLocal();
const tasksFor=d=>state.days[d]||[];

function flower(color,text,isCheck=false){const el=document.createElement('span');el.className='flower '+color;el.setAttribute('aria-hidden','true');if(text){const label=document.createElement('span');label.className=isCheck?'check':'remaining';label.textContent=text;el.append(label)}return el}
function renderCalendar(){const cal=$('calendar');cal.replaceChildren();$('month').textContent=`${year}년 ${month+1}월`;const first=new Date(year,month,1).getDay(),last=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)cal.append(document.createElement('span'));let total=0,doneTotal=0;for(let day=1;day<=last;day++){const d=new Date(year,month,day),k=key(d),tasks=tasksFor(k),done=tasks.filter(t=>t.done),remaining=tasks.length-done.length;total+=tasks.length;doneTotal+=done.length;const colors=new Set(done.map(t=>state.categories.find(c=>c.id===t.category)?.color||'black'));const color=colors.size>1?'mixed':(colors.values().next().value||'');const complete=tasks.length>0&&remaining===0;const b=document.createElement('button');b.className='day'+(k===selected?' selected':'')+(k===key(now)?' today':'')+(d.getDay()===0?' sun':d.getDay()===6?' sat':'');b.setAttribute('aria-label',`${month+1}월 ${day}일, ${tasks.length}개 중 ${done.length}개 완료`);b.setAttribute('aria-pressed',String(k===selected));b.append(flower(color,complete?'✓':tasks.length?String(remaining):'',complete));const n=document.createElement('span');n.className='daynum';n.textContent=day;b.append(n);b.onclick=()=>{selected=k;render();$('calendar').querySelector('[aria-pressed="true"]').focus({preventScroll:true})};cal.append(b)}}
function renderCategories(){const host=$('categories'),opened=new Map(Array.from(host.children).map(el=>[el.dataset.id,el.open]));host.replaceChildren();const tasks=tasksFor(selected);for(const cat of state.categories){const group=tasks.filter(t=>t.category===cat.id),details=document.createElement('details');details.className='category'+(cat.color==='red'?' important':'');details.dataset.id=cat.id;details.open=opened.get(cat.id)??true;const summary=document.createElement('summary'),pill=document.createElement('span');pill.className='catpill';const title=document.createElement('span');title.textContent=cat.name;const plus=document.createElement('button');plus.type='button';plus.className='plus';plus.textContent='+';plus.setAttribute('aria-label',cat.name+'에 할 일 추가');pill.append(title,plus);const count=document.createElement('span');count.className='categorycount';count.textContent=`${group.filter(t=>t.done).length}/${group.length}`;const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='⌄';summary.append(pill,count,arrow);details.append(summary);if(!group.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='아직 등록한 할 일이 없어요.';details.append(empty)}for(const task of group){const row=document.createElement('div');row.className='task'+(task.done?' done':'');const toggle=document.createElement('button');toggle.className='toggle';toggle.dataset.task=task.id;toggle.setAttribute('aria-label',task.name+(task.done?' 완료 취소':' 완료하기'));toggle.setAttribute('aria-pressed',String(task.done));toggle.append(flower(task.done?cat.color:'',task.done?'✓':'',task.done));toggle.onclick=async()=>{const date=selected,id=task.id,done=!task.done;await commit(latest=>{const found=(latest.days[date]||[]).find(t=>t.id===id);if(!found)throw Error('다른 기기에서 삭제된 할 일입니다.');found.done=done});Array.from(document.querySelectorAll('[data-task]')).find(b=>b.dataset.task===id)?.focus({preventScroll:true})};const text=document.createElement('span');text.className='tasktext';text.textContent=task.name;const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',task.name+' 삭제');remove.onclick=async()=>{const date=selected,id=task.id;if(confirm('“'+task.name+'” 항목을 삭제할까요?'))await commit(latest=>{latest.days[date]=(latest.days[date]||[]).filter(t=>t.id!==id)})};row.append(toggle,text,remove);details.append(row)}const form=document.createElement('form');form.className='add';const input=document.createElement('input');input.placeholder='＋ 할 일 추가';input.maxLength=100;input.required=true;input.setAttribute('aria-label',cat.name+' 새 할 일');const submit=document.createElement('button');submit.type='submit';submit.textContent='추가';form.append(input,submit);form.onsubmit=async e=>{e.preventDefault();const name=input.value.trim();if(!name)return;const date=selected,category=cat.id,id=uid();const ok=await commit(latest=>{if(!latest.categories.some(c=>c.id===category))throw Error('카테고리를 다시 확인해주세요.');(latest.days[date]??=[]).push({id,name,category,done:false})});if(ok){Array.from(document.querySelectorAll('details')).find(el=>el.dataset.id===category)?.querySelector('input').focus();notify('서버에 할 일을 저장했어요.')}};plus.onclick=e=>{e.preventDefault();details.open=true;input.focus()};details.append(form);host.append(details)}}
function render(){renderCalendar();const d=new Date(selected+'T12:00:00'),tasks=tasksFor(selected),done=tasks.filter(t=>t.done).length;$('year').textContent=`${d.getFullYear()} · MY DAILY PLAN`;$('selectedDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${['일','월','화','수','목','금','토'][d.getDay()]}요일`;$('daystat').textContent=tasks.length?`${tasks.length}개의 할 일 중 ${done}개 완료`:'오늘의 할 일을 하나씩 적어보세요.';$('badge').textContent=selected===key(now)?'오늘':`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;renderCategories();syncControls()}
